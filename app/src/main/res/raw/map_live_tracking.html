<!DOCTYPE html>
<html>
    <head>
        <title>SmartTrack Map</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
        <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
        <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
        <style>
            html, body, #map { height: 100%; margin: 0; padding: 0; overflow: hidden; }
            .marker-icon { width: 40px; height: 40px; }
            .geofence-status {
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgba(255, 255, 255, 0.9);
                padding: 8px 12px;
                border-radius: 6px;
                font-family: Arial, sans-serif;
                font-size: 12px;
                font-weight: bold;
                z-index: 1000;
                display: none;
            }
            .status-inside { color: #00aa33; }
            .status-outside { color: #ff0000; }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <div id="geofenceStatus" class="geofence-status"></div>
        <button id="followBtn" style="position:absolute;top:10px;right:10px;z-index:1000;display:none;">Follow tracking movement of the map</button>
        <script>
            mapboxgl.accessToken = 'pk.eyJ1IjoibmVsMDAzIiwiYSI6ImNtNzhiN2VodzB0ZGIybHExeWo3bHdweXMifQ.u9hzJr3DhSKNkv1pkH0qRQ';

            const map = new mapboxgl.Map({
              container: 'map',
              style: 'mapbox://styles/mapbox/streets-v11',
              center: [0, 0],
              zoom: 15
            });

            function createMarkerEl(color = '#0a84ff') {
              const el = document.createElement('div');
              el.className = 'marker-icon';
              el.innerHTML = `
                <svg viewBox="0 0 64 64" width="40" height="40">
                  <circle cx="32" cy="32" r="10" fill="${color}" stroke="white" stroke-width="3"/>
                </svg>`;
              return el;
            }

            let trackerMarker = new mapboxgl.Marker({ element: createMarkerEl('#0a84ff'), anchor: 'bottom' }).setLngLat([0, 0]).addTo(map);
            let deviceMarker  = null;
            let isPaired      = false;
            let isFollowing   = true;
            let isFirstUpdate = true;
            let geofenceRadius = 100; // meters
            let currentGeofenceColor = '#00ff55'; // Default green
            let geofenceEnabled = false;
            let geofenceCenter = null;

            const circleSourceId = 'geofence-src';
            const circleLayerId  = 'geofence-layer';
            const pathSourceId   = 'path-src';
            const pathLayerId    = 'path-layer';

            const followBtn = document.getElementById('followBtn');
            const geofenceStatusEl = document.getElementById('geofenceStatus');

            function setFollowing(follow) { 
                isFollowing = follow; 
                followBtn.style.display = follow ? 'none' : 'block'; 
            }

            function metersPerPixelAtLat(lat, zoom) {
              const earthCircumference = 40075016.686; // meters
              return earthCircumference * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom + 8);
            }

            function metersToPixelsAtLat(m, lat) {
              const zoom = map.getZoom();
              const metersPerPixel = metersPerPixelAtLat(lat, zoom);
              return m / metersPerPixel;
            }

            // More accurate distance calculation for geofence
            function calculateDistance(lat1, lng1, lat2, lng2) {
              const R = 6371000; // Earth's radius in meters
              const dLat = (lat2 - lat1) * Math.PI / 180;
              const dLng = (lng2 - lng1) * Math.PI / 180;
              const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                       Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                       Math.sin(dLng/2) * Math.sin(dLng/2);
              const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              return R * c;
            }

            function ensureMapLoaded(cb) {
              if (map.isStyleLoaded()) { cb(); }
              else { map.once('load', cb); }
            }

            function clearGeofence() {
              geofenceEnabled = false;
              geofenceCenter = null;
              geofenceStatusEl.style.display = 'none';
              
              ensureMapLoaded(() => {
                if (map.getLayer(circleLayerId)) map.removeLayer(circleLayerId);
                if (map.getLayer(circleLayerId + '-stroke')) map.removeLayer(circleLayerId + '-stroke');
                if (map.getSource(circleSourceId)) map.removeSource(circleSourceId);
              });
            }

            function drawGeofenceCircle(lat, lng, radius = null, color = 'green') {
              console.log('Drawing geofence circle at:', lat, lng, 'radius:', radius || geofenceRadius, 'color:', color);
              
              geofenceEnabled = true;
              geofenceCenter = [lat, lng];
              if (radius) geofenceRadius = radius;
              
              currentGeofenceColor = color === 'red' ? '#ff0000' : '#00ff55';
              const strokeColor = color === 'red' ? '#ff0000' : '#00aa33';

              ensureMapLoaded(() => {
                // Create a proper circle geometry instead of a point
                const circleGeometry = createCircleGeometry(lat, lng, geofenceRadius);
                
                if (!map.getSource(circleSourceId)) {
                  map.addSource(circleSourceId, {
                    type: 'geojson',
                    data: { type: 'Feature', geometry: circleGeometry }
                  });
                } else {
                  map.getSource(circleSourceId).setData({ type: 'Feature', geometry: circleGeometry });
                }

                if (!map.getLayer(circleLayerId)) {
                  map.addLayer({
                    id: circleLayerId,
                    type: 'fill',
                    source: circleSourceId,
                    paint: {
                      'fill-color': currentGeofenceColor,
                      'fill-opacity': 0.25
                    }
                  });
                  
                  // Add stroke layer
                  map.addLayer({
                    id: circleLayerId + '-stroke',
                    type: 'line',
                    source: circleSourceId,
                    paint: {
                      'line-color': strokeColor,
                      'line-width': 3
                    }
                  });
                } else {
                  map.setPaintProperty(circleLayerId, 'fill-color', currentGeofenceColor);
                  map.setPaintProperty(circleLayerId + '-stroke', 'line-color', strokeColor);
                }
              });
            }

            // Create a proper circle geometry
            function createCircleGeometry(centerLat, centerLng, radiusMeters) {
              const points = 64; // Number of points to create the circle
              const coordinates = [];
              
              for (let i = 0; i < points; i++) {
                const angle = (i / points) * 2 * Math.PI;
                const lat = centerLat + (radiusMeters / 111320) * Math.cos(angle);
                const lng = centerLng + (radiusMeters / (111320 * Math.cos(centerLat * Math.PI / 180))) * Math.sin(angle);
                coordinates.push([lng, lat]);
              }
              
              // Close the circle
              coordinates.push(coordinates[0]);
              
              return {
                type: 'Polygon',
                coordinates: [coordinates]
              };
            }

            function setGeofenceRadius(radius) {
              geofenceRadius = radius;
              if (geofenceEnabled && geofenceCenter) {
                // Redraw the circle with new radius
                drawGeofenceCircle(geofenceCenter[0], geofenceCenter[1], radius, currentGeofenceColor === '#ff0000' ? 'red' : 'green');
              }
            }

            function updateGeofenceStatus(isInside, distance = null) {
              if (!geofenceEnabled) {
                geofenceStatusEl.style.display = 'none';
                return;
              }

              geofenceStatusEl.style.display = 'block';
              geofenceStatusEl.className = 'geofence-status ' + (isInside ? 'status-inside' : 'status-outside');
              
              let statusText = isInside ? '✅ Inside geofence' : '🚨 Outside geofence';
              if (distance !== null) {
                statusText += ` (${Math.round(distance)}m)`;
              }
              
              geofenceStatusEl.textContent = statusText;

              // Update geofence circle color based on status
              const color = isInside ? 'green' : 'red';
              if (geofenceCenter) {
                drawGeofenceCircle(geofenceCenter[0], geofenceCenter[1], geofenceRadius, color);
              }
            }

            function drawPath(coords) {
              ensureMapLoaded(() => {
                if (map.getLayer(pathLayerId)) map.removeLayer(pathLayerId);
                if (map.getSource(pathSourceId)) map.removeSource(pathSourceId);

                const lineCoords = coords.map(([lat, lng]) => [lng, lat]);
                map.addSource(pathSourceId, { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: lineCoords } } });
                map.addLayer({ id: pathLayerId, type: 'line', source: pathSourceId, paint: { 'line-color': '#0066ff', 'line-width': 3 } });

                const bounds = lineCoords.reduce((b, c) => b.extend(c), new mapboxgl.LngLatBounds(lineCoords[0], lineCoords[0]));
                map.fitBounds(bounds, { padding: 24 });
              });
            }

            function setPaired(paired) {
              isPaired = paired;
              if (!paired) {
                if (deviceMarker) { deviceMarker.remove(); deviceMarker = null; }
                ensureMapLoaded(() => {
                  if (map.getSource('device-to-tracker')) {
                    if (map.getLayer('device-to-tracker')) map.removeLayer('device-to-tracker');
                    map.removeSource('device-to-tracker');
                  }
                });
              }
            }

            function updateDevicePosition(deviceLat, deviceLng) {
              if (!deviceMarker) {
                deviceMarker = new mapboxgl.Marker({ element: createMarkerEl('#ff3b30'), anchor: 'bottom' })
                  .setLngLat([deviceLng, deviceLat]).addTo(map);
              } else {
                deviceMarker.setLngLat([deviceLng, deviceLat]);
              }
              if (isFollowing) { map.setCenter([deviceLng, deviceLat]); map.setZoom(17); }
            }

            function updateMarkerPosition(lat, lng, isInside = true) {
              trackerMarker.setLngLat([lng, lat]);
              
              // Update geofence status if geofence is enabled
              if (geofenceEnabled && geofenceCenter) {
                const distance = calculateDistance(geofenceCenter[0], geofenceCenter[1], lat, lng);
                const actualIsInside = distance <= geofenceRadius;
                
                // Use the actual calculated status instead of the passed parameter
                updateGeofenceStatus(actualIsInside, distance);
              }
              
              if (isFirstUpdate) { 
                map.setCenter([lng, lat]); 
                isFirstUpdate = false; 
              }
            }

            // No need for zoom listener with polygon-based circles

            // Expose functions for Android
            window.updateMarkerPosition = updateMarkerPosition;
            window.setGeofenceRadius = setGeofenceRadius;
            window.drawGeofenceCircle = drawGeofenceCircle;
            window.clearGeofence = clearGeofence;
            window.drawPath = drawPath;
            window.updateDevicePosition = updateDevicePosition;
            window.setPaired = setPaired;
            window.updateGeofenceStatus = updateGeofenceStatus;

            // Optional initial draw (won't interfere with Android calls)
            window.onload = function() {
              map.on('dragstart', function() { if (isFollowing) setFollowing(false); });
              followBtn.onclick = function() {
                setFollowing(true);
                const center = deviceMarker ? deviceMarker.getLngLat() : trackerMarker.getLngLat();
                map.setCenter(center); map.setZoom(17);
              };
            };
        </script>
    </body>
</html>
